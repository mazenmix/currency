<style>
:root{color-scheme:dark;--line:#2a2a2d;--soft:#9b9ba0;--blue:#168fff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}

 .display{height:99px;flex:0 0 99px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:clamp(6px,2vw,18px);padding:0 clamp(12px,3vw,24px);min-width:0;width:100%}

.pair{height:86px;flex:0 0 86px;display:flex;align-items:center;padding:0 10px;gap:6px;min-width:0}
.pair button{flex:1;display:flex;align-items:center;text-align:left;background:none;min-width:0;padding:0;gap:7px}
.flag{font-size:35px;line-height:1;white-space:nowrap;display:flex;align-items:center;justify-content:center;flex:0 0 47px;width:47px;min-width:0;font-family:"Apple Color Emoji","Segoe UI Emoji",sans-serif}.flag img{display:block;width:46px;height:32px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px #ffffff20}
.pair .info{display:flex;flex-direction:column;min-width:0;gap:2px;overflow:hidden}.pair .hint{overflow:hidden;text-overflow:ellipsis}.pair .code{font-size:18px;font-weight:500}.hint{font-size:13px;color:#929298;white-space:nowrap}

.pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));height:100%;flex:1;min-height:0;border-top:1px solid var(--line)}
.key{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;background:#000;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;font-size:35px;font-weight:300;touch-action:manipulation;user-select:none;transition:background .06s}
.key:active{background:#242424}
.key.action{font-size:20px}.key svg{height:27px;width:27px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.key.clear{background:#ff3335}.key.clear:active{background:#da2529}
.key.delete{background:#eee;color:#141414}.key.delete:active{background:#ccc}

.key.swap:active{background:#30bd3c}.key.swap svg{height:30px;width:30px}

footer{background:#1b1b1d;flex:0 0 56px;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:12px;gap:8px}footer a{color:#9abfe8;text-decoration:none;white-space:nowrap;font-size:11px}footer a:hover{text-decoration:underline}
#updated{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}#brandSignature{color:#a0a0a4;font-size:14px;letter-spacing:.1px;flex:0 0 auto;white-space:nowrap;font-weight:600}

.search input{border:0;border-radius:11px;background:#272729;color:#fff;padding:11px 13px;width:100%;font-size:15px;outline:none}

.detail strong{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail small{font-size:13px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check{font-size:22px;color:#168eff}.muted{color:var(--soft)}
.remove{background:none;color:#ff575c;font-size:23px;padding:6px 9px}
.move{background:none;color:#aaa;font-size:22px;padding:6px 8px;touch-action:none}
.infoLine{color:#a5a5a5;padding:15px;font-size:12px}
.settingsCard{display:flex;align-items:center;background:#252525;border:1px solid #353535;padding:20px;border-radius:17px;width:calc(100% - 36px);margin:24px 18px;gap:13px;text-align:left}
.settingsCard strong{font-size:17px}.settingsCard small{display:block;color:#aaa;font-size:12px;margin-top:6px}
.mark{font-size:30px;font-weight:900;text-align:center;margin:36px 0 0}.mark b{color:#ffb228}
.brand{text-align:center;font-size:14px;color:#999;margin:7px 0}
#toast{position:fixed;z-index:40;bottom:73px;left:50%;transform:translateX(-50%);background:#333;border-radius:12px;padding:10px 16px;color:white;display:none;font-size:13px;white-space:nowrap}
@media (max-width:375px){header{padding:0 12px}#rate{font-size:18px}.pair{padding:0 6px;gap:4px}.flag{font-size:30px;flex-basis:39px;width:39px}.flag img{width:39px;height:27px}.pair .code{font-size:16px}.hint{font-size:11px}.arrow{min-width:22px;width:22px}.display{gap:7px;padding:0 11px}}
@media (max-height:630px){header{height:54px;flex-basis:54px}.display{height:74px;flex-basis:74px}.pair{height:65px;flex-basis:65px}footer{height:48px;flex-basis:48px}}
@media (min-width:560px){#app,#sheet{border-left:1px solid #222;border-right:1px solid #222}body{background:#090909}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="shade" aria-hidden="true"><section id="sheet" role="dialog" aria-modal="true"><div class="sheetTop"><button id="closeSheet" aria-label="Close">×</button><h2 id="sheetTitle">Currencies</h2><button id="rightSheet" class="primary" aria-label="Done">✓</button></div><div id="sheetBody"></div></section></div>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),K='mx.currency.web.v2';
const P='USD EUR GBP IQD PHP IDR TRY THB VND AED SAR QAR KWD MYR SGD JPY CNY HKD KRW INR AUD NZD CAD CHF ARS BRL MXN'.split(' ');
const ACTIVE=new Set("AED AFN ALL AMD AOA ARS AUD AWG AZN BAM BBD BDT BHD BIF BMD BND BOB BRL BSD BTN BWP BYN BZD CAD CDF CHF CLP CNY COP CRC CUP CVE CZK DJF DKK DOP DZD EGP ERN ETB EUR FJD FKP GBP GEL GHS GIP GMD GNF GTQ GYD HKD HNL HTG HUF IDR ILS INR IQD IRR ISK JMD JOD JPY KES KGS KHR KMF KRW KWD KYD KZT LAK LBP LKR LRD LSL LYD MAD MDL MGA MKD MMK MNT MOP MRU MUR MVR MWK MXN MYR MZN NAD NGN NIO NOK NPR NZD OMR PAB PEN PGK PHP PKR PLN PYG QAR RON RSD RUB RWF SAR SBD SCR SDG SEK SGD SHP SLE SOS SRD SSP STN SYP SZL THB TJS TMT TND TOP TRY TTD TWD TZS UAH UGX USD UYU UZS VES VND VUV WST XAF XCD XCG XOF XPF YER ZAR ZMW ZWG".split(" "));
const F=Object.fromEntries(('USD:🇺🇸 EUR:🇪🇺 GBP:🇬🇧 IQD:🇮🇶 PHP:🇵🇭 IDR:🇮🇩 TRY:🇹🇷 THB:🇹🇭 VND:🇻🇳 AED:🇦🇪 SAR:🇸🇦 QAR:🇶🇦 KWD:🇰🇼 BHD:🇧🇭 OMR:🇴🇲 JOD:🇯🇴 EGP:🇪🇬 MYR:🇲🇾 SGD:🇸🇬 JPY:🇯🇵 CNY:🇨🇳 HKD:🇭🇰 KRW:🇰🇷 INR:🇮🇳 AUD:🇦🇺 NZD:🇳🇿 CAD:🇨🇦 CHF:🇨🇭 ARS:🇦🇷 BRL:🇧🇷 MXN:🇲🇽 RUB:🇷🇺 VND:🇻🇳 AFN:🇦🇫 BDT:🇧🇩 PKR:🇵🇰 ZAR:🇿🇦 EUR:🇪🇺').split(' ').map(x=>[x.slice(0,3),x.slice(4)]));
const defaultFav=[['USD','PHP'],['USD','IQD'],['USD','IDR'],['USD','TRY'],['USD','THB'],['USD','VND']];
let saved={};try{saved=JSON.parse(localStorage.getItem(K)||'{}')}catch{}
const s={from:ACTIVE.has(saved.from)?saved.from:'USD',to:ACTIVE.has(saved.to)?saved.to:'IQD',input:'',favorites:(Array.isArray(saved.favorites)?saved.favorites:defaultFav).filter(p=>Array.isArray(p)&&p.length===2&&ACTIVE.has(p[0])&&ACTIVE.has(p[1])),rates:{USD:1,...(saved.rates||{})},meta:{...(saved.meta||{})},updated:saved.updated||null,screen:'',query:'',busy:false,lastBase:0,lastCheckedAt:null};
// Display the last *verified* IQWealth reading while awaiting the live endpoint.
// Label the stored quote as stale until a new source check succeeds.
try{
 const savedQuote=JSON.parse(localStorage.getItem('mx.iqwealth.iqd.verified.v1')||'null');
 const verifiedAt=Date.parse(savedQuote?.publishedAt||'');
 if(savedQuote?.source==='IQWealth'&&Number(savedQuote.rate)>=800&&Number(savedQuote.rate)<=3500
    &&Number.isFinite(verifiedAt)&&verifiedAt<=Date.now()+600000&&verifiedAt>Date.now()-72*3600000){
  s.rates.IQD=Number(savedQuote.rate);
  s.meta.IQD={buy:s.rates.IQD,sell:s.rates.IQD,kind:'parallel',source:'IQWealth · Kifah SELL',
   publishedAt:savedQuote.publishedAt,stale:true};
  s.updated=savedQuote.publishedAt;
 }
}catch{}
delete s.rates.IQD;delete s.meta.IQD;
if(s.rates.IQD>0&&s.rates.IQD<4)s.rates.IQD*=1000;if(s.rates.IQD>=80&&s.rates.IQD<=350)s.rates.IQD*=10;
if(s.rates.IQD&&!(s.rates.IQD>=800&&s.rates.IQD<=3500))delete s.rates.IQD;
function save(){try{localStorage.setItem(K,JSON.stringify({from:s.from,to:s.to,favorites:s.favorites,rates:s.rates,meta:s.meta,updated:s.updated}))}catch{}}
function name(code){if(code==='IQD')return 'Iraqi Dinar';const custom={XCG:'Caribbean Guilder',ZWG:'Zimbabwe Gold (ZiG)',SLE:'Sierra Leonean Leone'};if(custom[code])return custom[code];try{return new Intl.DisplayNames(['en'],{type:'currency'}).of(code)||code}catch{return code}}
function catalog(){return [...ACTIVE].filter(code=>code==='USD'||Number(s.rates[code])>0).map(code=>({code,name:name(code)})).sort((a,b)=>{let i=P.indexOf(a.code),j=P.indexOf(b.code);return i>=0&&j>=0?i-j:i>=0?-1:j>=0?1:a.name.localeCompare(b.name)})}
let currencies=catalog();
const SEARCH_ALIAS={EUR:'spain spanish croatia croatian bulgaria bulgarian germany france belgium italy portugal austria netherlands greece ireland finland slovakia slovenia luxembourg cyprus malta estonia latvia lithuania'};
function searchMatch(c,q){return c.code.toLowerCase().includes(q)||c.name.toLowerCase().includes(q)||(SEARCH_ALIAS[c.code]||'').includes(q)}
function fmt(v,n=0){if(!Number.isFinite(v))return '—';return new Intl.NumberFormat('en-US',{minimumFractionDigits:n,maximumFractionDigits:n}).format(v)}
function rate(f,t){if(!ACTIVE.has(f)||!ACTIVE.has(t))return null;if(f===t)return 1;let a=Number(s.rates[f]),b=Number(s.rates[t]);if(!(a>0&&b>0))return null;let ask=Number(s.meta[f]?.sell)||a,bid=Number(s.meta[t]?.buy)||b;return ask>0?bid/ask:null}
const COUNTRY=Object.fromEntries("USD:us EUR:eu GBP:gb IQD:iq PHP:ph IDR:id TRY:tr THB:th VND:vn AED:ae SAR:sa QAR:qa KWD:kw MYR:my SGD:sg JPY:jp CNY:cn HKD:hk KRW:kr INR:in AUD:au NZD:nz CAD:ca CHF:ch ARS:ar BRL:br MXN:mx BHD:bh OMR:om JOD:jo LBP:lb SYP:sy IRR:ir ILS:il EGP:eg MAD:ma DZD:dz TND:tn LYD:ly SDG:sd BND:bn MOP:mo TWD:tw PKR:pk BDT:bd LKR:lk NPR:np AFN:af MMK:mm KHR:kh LAK:la MNT:mn KZT:kz UZS:uz GEL:ge AMD:am AZN:az RUB:ru UAH:ua PLN:pl CZK:cz HUF:hu RON:ro BGN:bg RSD:rs ALL:al MKD:mk BAM:ba MDL:md BYN:by SEK:se NOK:no DKK:dk ISK:is CLP:cl COP:co PEN:pe UYU:uy PYG:py BOB:bo VES:ve GYD:gy SRD:sr ZAR:za NGN:ng GHS:gh KES:ke TZS:tz UGX:ug ETB:et RWF:rw ZMW:zm BWP:bw MUR:mu MGA:mg AOA:ao AWG:aw BBD:bb BIF:bi BMD:bm BSD:bs BTN:bt BZD:bz CDF:cd CRC:cr CUP:cu CVE:cv DJF:dj DOP:do ERN:er FJD:fj FKP:fk GIP:gi GMD:gm GNF:gn GTQ:gt HNL:hn HTG:ht JMD:jm KGS:kg KMF:km KYD:ky LRD:lr LSL:ls MRU:mr MVR:mv MWK:mw MZN:mz NAD:na NIO:ni PAB:pa PGK:pg SBD:sb SCR:sc SHP:sh SLE:sl SOS:so SSP:ss STN:st SZL:sz TJS:tj TMT:tm TOP:to TTD:tt VUV:vu WST:ws XAF:cm XCD:ag XCG:cw XOF:sn XPF:pf YER:ye ZWG:zw".split(' ').map(x=>x.split(':')));
function setFlag(el,code){if(el.dataset.code===code)return;el.dataset.code=code;const cc=COUNTRY[code];el.textContent=cc&&/^[a-z]{2}$/.test(cc)?String.fromCodePoint(...[...cc.toUpperCase()].map(c=>c.charCodeAt(0)+127397)):'🏳️'}
function fitNumbers(){
 const root=document.querySelector('.display');
 if(!root)return;
 const canvas=fitNumbers.canvas||(fitNumbers.canvas=document.createElement('canvas'));
 const ctx=canvas.getContext('2d');
 if(!ctx)return;
 const maxSize=Math.min(56,root.getBoundingClientRect().width*0.14);
 for(const id of ['entered','converted']){
  const el=$(id);
  const text=el.textContent||'0';
  const box=el.getBoundingClientRect();
  const available=Math.max(4,box.width-2);
  const style=getComputedStyle(el);
  ctx.font='200 '+maxSize+'px '+style.fontFamily;
  const measured=ctx.measureText(text).width+Math.max(0,text.length-1)*maxSize*0.03;
  const target=Math.max(4,Math.min(maxSize,maxSize*available/Math.max(measured,1)));
  el.style.fontSize=target.toFixed(2)+'px';
 }
}
let numberFitFrame=0;
function scheduleNumberFit(){cancelAnimationFrame(numberFitFrame);numberFitFrame=requestAnimationFrame(fitNumbers)}
window.addEventListener('resize',scheduleNumberFit);
if('ResizeObserver' in window)new ResizeObserver(scheduleNumberFit).observe($('app'));
if(document.fonts?.ready)document.fonts.ready.then(scheduleNumberFit);
function draw(){let a=s.input||'0',r=rate(s.from,s.to),out=r===null?'—':fmt((Number(s.input)||0)*r);$('entered').textContent=a;$('converted').textContent=out;
 scheduleNumberFit();
 $('rate').textContent='1 '+s.from+' = '+(r===null?'—':new Intl.NumberFormat('en-US',{maximumFractionDigits:s.to==='IQD'?2:3}).format(r))+' '+s.to;
 $('rate').style.fontSize=$('rate').textContent.length>24?'16px':'20px';
 for(const side of ['from','to']){setFlag($(side+'Flag'),s[side]);$(side+'Code').textContent=s[side];}
 const isIqd=s.from==='IQD'||s.to==='IQD';
 // Last Updated means the latest successful data synchronization, not when IQWealth published the quote.
 const publishedMs=Date.parse(isIqd?(s.meta.IQD?.publishedAt||''):(s.updated||''));
 const late=isIqd&&(s.meta.IQD?.stale===true||(Number.isFinite(publishedMs)&&Date.now()-publishedMs>36*3600*1000));
 const d=s.lastCheckedAt?new Date(s.lastCheckedAt):null;
 const valid=d&&!isNaN(+d);
 const dateLabel=valid?d.toLocaleTimeString('en-US',{timeZone:'Asia/Baghdad',hour:'numeric',minute:'2-digit',hour12:true}).replace(/\s*(AM|PM)\s*$/i,''):'—';
 const isPhpPair=!isIqd&&(s.from==='PHP'||s.to==='PHP');

 $('updated').textContent=(late?'Stale • ':'')+'Last Updated: '+dateLabel;
}
function add(n){if(n==='.'){if(!s.input.includes('.'))s.input=s.input?s.input+'.':'0.'}else if(s.input.length<16)s.input=s.input==='0'?n:s.input+n;draw()}
function flip(){let t=s.from;s.from=s.to;s.to=t;save();draw();refresh()}
function open(screen){s.screen=screen;s.query='';$('shade').classList.add('visible');$('shade').setAttribute('aria-hidden','false');render();history.pushState({mxScreen:screen},'','#'+screen)}
function close(back=false){s.screen='';$('shade').classList.remove('visible');$('shade').setAttribute('aria-hidden','true');$('sheetBody').replaceChildren();if(!back&&location.hash)history.back()}
window.addEventListener('popstate',()=>{if(s.screen)close(true)});
function top(title,right='✓',action=()=>close()){$('sheetTitle').textContent=title;$('rightSheet').textContent=right;$('rightSheet').style.visibility=right?'visible':'hidden';$('rightSheet').onclick=action;$('closeSheet').onclick=()=>s.screen==='add'? (s.screen='favorites',render()):close()}
function searchBox(oninput){let d=document.createElement('div');d.className='search';let i=document.createElement('input');i.placeholder='Search for currency…';i.type='search';i.value=s.query;i.oninput=()=>{s.query=i.value;oninput()};d.append(i);return d}
function currencyItem(c,selected,action,extra=''){let b=document.createElement('button');b.className='item';b.innerHTML='<span class="flag"></span><span class="detail"><strong>'+c.name+'</strong><small>'+c.code+'</small></span><span class="check">'+(selected?'✓':extra)+'</span>';setFlag(b.querySelector('.flag'),c.code);b.onclick=action;return b}
function choose(side){let body=$('sheetBody');top(side==='from'?'Starting Currency':'Ending Currency');body.replaceChildren();
 let items=document.createElement('div');function fill(){items.replaceChildren();let q=s.query.toLowerCase().trim();for(let c of currencies.filter(x=>!q||searchMatch(x,q)))items.append(currencyItem(c,s[side]===c.code,()=>{s[side]=c.code;save();draw();close();refresh()}))}
 body.append(searchBox(fill),items);fill()}
function addFav(){let body=$('sheetBody');top('Add Favorite','✓',()=>{s.screen='favorites';render()});body.replaceChildren();let items=document.createElement('div');
 function fill(){items.replaceChildren();let q=s.query.toLowerCase().trim();for(const c of currencies.filter(x=>x.code!==s.from&&(!q||searchMatch(x,q)))){let hit=s.favorites.some(p=>p[0]===s.from&&p[1]===c.code);items.append(currencyItem(c,hit,()=>{if(hit)s.favorites=s.favorites.filter(p=>!(p[0]===s.from&&p[1]===c.code));else s.favorites.unshift([s.from,c.code]);save();fill()},hit?'✓':'+'))}}
 body.append(searchBox(fill),items);fill()}
function favorites(){let body=$('sheetBody');top('Favorites','+',()=>{s.screen='add';s.query='';render()});body.replaceChildren();
 if(!s.favorites.some(p=>rate(p[0],p[1])!==null)){body.innerHTML='<div class="infoLine">No Favorites. Tap + to add a currency.</div>';return}
 s.favorites.forEach((p,i)=>{if(rate(p[0],p[1])===null)return;let c={code:p[1],name:name(p[1])},v=rate(p[0],p[1]),item=document.createElement('div');item.className='item';
 let b=document.createElement('button');b.className='item';b.style.cssText='flex:1;min-width:0;border:0;padding:0;';b.innerHTML='<span class="flag">'+''+'</span><span class="detail"><strong>1 '+p[0]+' → '+(v===null?'—':fmt(v,v>=100?0:3))+' '+p[1]+'</strong><small>'+c.code+' ('+c.name+')</small></span>';
 setFlag(b.querySelector('.flag'),p[1]);b.onclick=()=>{s.from=p[0];s.to=p[1];save();draw();close();refresh()};
 let del=document.createElement('button');del.className='remove';del.textContent='×';del.title='Remove';del.onclick=()=>{s.favorites.splice(i,1);save();favorites()};
 let up=document.createElement('button');up.className='move';up.textContent='≡';up.title='Move favorite up';up.onclick=()=>{if(i){let a=s.favorites[i-1];s.favorites[i-1]=s.favorites[i];s.favorites[i]=a;save();favorites()}};
 item.append(b,up,del);
 item.draggable=true;
 item.addEventListener('dragstart',ev=>{ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',String(i));item.style.opacity='.45'});
 item.addEventListener('dragend',()=>{item.style.opacity='1'});
 item.addEventListener('dragover',ev=>ev.preventDefault());
 item.addEventListener('drop',ev=>{ev.preventDefault();let j=Number(ev.dataTransfer.getData('text/plain'));if(Number.isInteger(j)&&j>=0&&j<s.favorites.length&&j!==i){let v=s.favorites.splice(j,1)[0];s.favorites.splice(i,0,v);save();favorites()}});
 let touchY=null;
 up.addEventListener('pointerdown',ev=>{if(ev.pointerType==='touch'){touchY=ev.clientY;up.setPointerCapture(ev.pointerId)}});
 up.addEventListener('pointerup',ev=>{if(touchY!==null){let offset=Math.round((ev.clientY-touchY)/Math.max(55,item.clientHeight));touchY=null;if(offset){let j=Math.max(0,Math.min(s.favorites.length-1,i+offset));let v=s.favorites.splice(i,1)[0];s.favorites.splice(j,0,v);save();favorites()}}});
 body.append(item)})}
function live(){let body=$('sheetBody');top('Live Rates','⟳',()=>refresh(true).then(()=>{if(s.screen==='live')live()}));body.replaceChildren();
 let note=document.createElement('div');note.className='infoLine';note.textContent='Rates per 1 USD • Baghdad market selling rate for IQD';let list=document.createElement('div');
 function fill(){list.replaceChildren();let q=s.query.toLowerCase().trim();for(const c of currencies.filter(x=>!q||searchMatch(x,q))){let v=rate('USD',c.code),item=document.createElement('div');item.className='item';item.innerHTML='<span class="flag">'+''+'</span><span class="detail"><strong>'+c.code+'</strong><small>'+c.name+'</small></span><span class="detail" style="text-align:right;flex:0 0 auto;max-width:48%"><strong>'+ (v===null?'—':fmt(v,v>=100?0:3)) +'</strong><small>'+ (c.code==='IQD'?'Baghdad market':v===null?'Unavailable':'per 1 USD') +'</small></span>';setFlag(item.querySelector('.flag'),c.code);list.append(item)}}
 body.append(searchBox(fill),note,list);fill()}
function settings(){let body=$('sheetBody');top('Settings','');body.replaceChildren();let b=document.createElement('button');b.className='settingsCard';b.innerHTML='<span style="font-size:32px;color:#43d56b">⇩</span><span><strong>Install MX Currency</strong><small>Add to Home Screen on iPhone, Android or desktop</small></span>';b.onclick=install;
 let m=document.createElement('div');m.className='mark';m.innerHTML='M<b>X</b>';let n=document.createElement('div');n.className='brand';n.textContent='MazenmiX';body.append(b,m,n)}
function render(){if(s.screen==='from'||s.screen==='to')choose(s.screen);else if(s.screen==='favorites')favorites();else if(s.screen==='add')addFav();else if(s.screen==='live')live();else if(s.screen==='settings')settings()}
let prompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();prompt=e});
function toast(str){let t=$('toast');t.textContent=str;t.style.display='block';setTimeout(()=>{t.style.display='none'},2200)}
async function install(){if(prompt){prompt.prompt();await prompt.userChoice;prompt=null}else toast(/iPhone|iPad/i.test(navigator.userAgent)?'Safari → Share → Add to Home Screen':'Browser menu → Install app')}
async function json(url){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),9000);try{let r=await fetch(url,{cache:'no-store',signal:ctrl.signal,headers:{Accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}}
async function first(urls){for(let u of urls){try{return await json(u)}catch{}}return null}
function iqdQuote(d){const n=Number(d?.sell??d?.rate);return d?.source==='IQWealth · iraqsm.com'&&n>=800&&n<=3500?{rate:n,publishedAt:d.updatedAt||null,stale:d.stale===true}:null}
async function refresh(force=false){if(s.busy)return;s.busy=true;try{
 let bucket=Math.floor(Date.now()/300000);
 let needsBook=force||Date.now()-s.lastBase>60000;
 const jobs=[];
 let bookLoaded=false,iqdLoaded=false;
 if(needsBook){s.lastBase=Date.now();jobs.push((async()=>{let b=await first(['/api/rates?v='+bucket]);if(b?.base==='USD'&&b.rates&&Number(b.rates.PHP)>0){const next={USD:1};for(const [k,v] of Object.entries(b.rates))if(k!=='IQD'&&ACTIVE.has(k)&&Number(v)>0)next[k]=Number(v);if(s.meta.IQD?.source==='IQWealth · Kifah SELL'&&Number(s.rates.IQD)>0)next.IQD=s.rates.IQD;s.rates=next;for(const [k,v] of Object.entries(b.meta||{}))if(k!=='IQD'&&ACTIVE.has(k))s.meta[k]=v;s.updated=b.updatedAt||s.updated;bookLoaded=true}})())}
 if(s.from==='IQD'||s.to==='IQD'||s.favorites.some(p=>p.includes('IQD')))jobs.push((async()=>{let d=await first(['/api/iqd?v='+Math.floor(Date.now()/60000)]);let x=iqdQuote(d);if(x){iqdLoaded=true;s.rates.IQD=x.rate;s.meta.IQD={buy:x.rate,sell:x.rate,kind:'parallel',source:'IQWealth · Kifah SELL',publishedAt:x.publishedAt,stale:x.stale};if(x.publishedAt)s.updated=x.publishedAt;try{localStorage.setItem('mx.iqwealth.iqd.verified.v1',JSON.stringify({source:'IQWealth',rate:x.rate,publishedAt:x.publishedAt}))}catch{}}else if(s.meta.IQD){s.meta.IQD.stale=true}else{delete s.rates.IQD;delete s.meta.IQD}})());
 await Promise.allSettled(jobs);
 const isIqdPair=s.from==='IQD'||s.to==='IQD';
 if(isIqdPair?iqdLoaded:bookLoaded)s.lastCheckedAt=Date.now();
 currencies=catalog();save();draw();if(s.screen&&!document.activeElement?.matches('.search input'))render();
 }finally{s.busy=false}}
document.querySelectorAll('[data-n]').forEach(b=>b.addEventListener('click',()=>add(b.dataset.n)));
$('clear').onclick=()=>{s.input='';draw()};$('backspace').onclick=()=>{s.input=s.input.slice(0,-1);draw()};
$('swap').onclick=flip;$('fromSelect').onclick=()=>open('from');$('toSelect').onclick=()=>open('to');
$('closeSheet').onclick=()=>close();
$('converted').onclick=async()=>{if($('converted').textContent==='—')return;try{await navigator.clipboard.writeText($('converted').textContent);toast('Copied')}catch{toast('Copy unavailable')}};
document.addEventListener('keydown',e=>{if(s.screen||e.ctrlKey||e.metaKey||e.altKey||['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(/^[0-9.]$/.test(e.key)){e.preventDefault();add(e.key)}else if(e.key==='Backspace'){e.preventDefault();$('backspace').click()}else if(e.key==='Delete'){e.preventDefault();$('clear').click()}else if(e.key==='Enter'){e.preventDefault();flip()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});window.addEventListener('online',()=>refresh(true));
draw();refresh(true);setInterval(()=>{if(!document.hidden)refresh()},60000);
if('serviceWorker'in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js?v=6').catch(()=>{}));
})();
</script>
</body></html>
